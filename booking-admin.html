<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Admin – Luali Pizza</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #fff;
            font-family: 'Lato', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 60px 24px 80px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(28px, 6vw, 52px);
            font-weight: 900;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.72rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 48px;
            text-align: center;
        }

        /* PASSWORD GATE */
        .gate {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .gate label {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .gate input[type="password"] {
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            color: #fff;
            background: transparent;
            border: none;
            border-bottom: 1px solid #555;
            padding: 10px 0;
            outline: none;
            width: 100%;
            text-align: center;
            letter-spacing: 0.2em;
            transition: border-color 0.2s;
        }

        .gate input[type="password"]:focus { border-bottom-color: #fff; }

        .gate button {
            margin-top: 24px;
            font-family: 'Lato', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #111;
            background: #fff;
            border: none;
            padding: 14px 36px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        .gate button:hover { opacity: 0.75; }

        .gate-error {
            margin-top: 14px;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #e07070;
        }

        /* SLOT GRID */
        .admin-panel {
            width: 100%;
            max-width: 560px;
            display: none;
        }

        .panel-note {
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            opacity: 0.45;
            line-height: 1.8;
            margin-bottom: 32px;
            text-align: center;
        }

        .slot-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (min-width: 400px) {
            .slot-list { grid-template-columns: 1fr 1fr 1fr; }
        }

        .slot-card {
            border: 1px solid #2a2a2a;
            padding: 14px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .slot-card.taken { border-color: #555; }

        .slot-time {
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        .slot-status {
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .slot-card.taken .slot-status { color: #e07070; }
        .slot-card:not(.taken) .slot-status { opacity: 0.3; }

        .unbook-btn {
            font-family: 'Lato', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #111;
            background: #fff;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .unbook-btn:hover { opacity: 0.7; }
        .unbook-btn:disabled { opacity: 0.3; cursor: default; }

        .reload-btn {
            margin-top: 32px;
            display: block;
            width: 100%;
            font-family: 'Lato', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #fff;
            background: none;
            border: 1px solid #444;
            padding: 14px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .reload-btn:hover { border-color: #fff; }

        .status-msg {
            margin-top: 20px;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.5;
            text-align: center;
            min-height: 1.4em;
        }

        footer {
            margin-top: auto;
            padding-top: 48px;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.25;
        }
    </style>
</head>
<body>

    <h1>Slot Admin</h1>
    <p class="subtitle">Luali Backyard Pizza Night</p>

    <!-- PASSWORD GATE -->
    <div class="gate" id="gate">
        <label for="adminPw">Password</label>
        <input type="password" id="adminPw" autocomplete="current-password">
        <button onclick="unlock()">Enter</button>
        <p class="gate-error" id="gateError" hidden>Wrong password.</p>
    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-panel" id="adminPanel">
        <p class="panel-note">Booked slots are highlighted. Click Unbook to free a slot back up.</p>
        <div class="slot-list" id="slotList"></div>
        <button class="reload-btn" onclick="loadSlots()">Refresh</button>
        <p class="status-msg" id="statusMsg"></p>
    </div>

    <footer>&copy; 2026 Luali Pizza</footer>

    <script>
    // ← Change this password before going live
    const ADMIN_PASSWORD = 'luali2026';

    const SLOTS = [
        "5:00pm", "5:10pm", "5:20pm", "5:30pm", "5:40pm", "5:50pm",
        "6:00pm", "6:10pm", "6:20pm", "6:30pm", "6:40pm", "6:50pm",
        "7:00pm", "7:10pm", "7:20pm", "7:30pm", "7:40pm", "7:50pm",
    ];

    document.getElementById('adminPw').addEventListener('keydown', e => {
        if (e.key === 'Enter') unlock();
    });

    function unlock() {
        const pw = document.getElementById('adminPw').value;
        if (pw !== ADMIN_PASSWORD) {
            document.getElementById('gateError').hidden = false;
            document.getElementById('adminPw').value = '';
            document.getElementById('adminPw').focus();
            return;
        }
        document.getElementById('gate').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadSlots();
    }

    async function loadSlots() {
        document.getElementById('statusMsg').textContent = 'Loading…';
        let booked = [];
        try {
            const res = await fetch('/.netlify/functions/booked-slots');
            booked = await res.json();
        } catch {
            document.getElementById('statusMsg').textContent = 'Could not load slots.';
            return;
        }

        const list = document.getElementById('slotList');
        list.innerHTML = '';

        SLOTS.forEach(slot => {
            const isTaken = booked.includes(slot);
            const card = document.createElement('div');
            card.className = 'slot-card' + (isTaken ? ' taken' : '');
            card.innerHTML =
                '<span class="slot-time">' + slot + '</span>' +
                '<span class="slot-status">' + (isTaken ? 'Booked' : 'Free') + '</span>' +
                (isTaken
                    ? '<button class="unbook-btn" onclick="unbook(this, \'' + slot + '\')">Unbook</button>'
                    : '');
            list.appendChild(card);
        });

        document.getElementById('statusMsg').textContent = booked.length + ' slot' + (booked.length === 1 ? '' : 's') + ' booked.';
    }

    async function unbook(btn, slot) {
        btn.disabled = true;
        btn.textContent = '…';
        document.getElementById('statusMsg').textContent = '';

        try {
            const res = await fetch('/.netlify/functions/booked-slots', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slot }),
            });

            if (res.ok) {
                await loadSlots();
            } else {
                btn.disabled = false;
                btn.textContent = 'Unbook';
                document.getElementById('statusMsg').textContent = 'Failed — try again.';
            }
        } catch {
            btn.disabled = false;
            btn.textContent = 'Unbook';
            document.getElementById('statusMsg').textContent = 'Failed — try again.';
        }
    }
    </script>

</body>
</html>
