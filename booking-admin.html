<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Admin – Luali Pizza</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #fff;
            font-family: 'Lato', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 24px 80px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(28px, 6vw, 52px);
            font-weight: 900;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.72rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 48px;
            text-align: center;
        }

        /* PASSWORD GATE */
        .gate {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .gate label {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .gate input[type="password"] {
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            color: #fff;
            background: transparent;
            border: none;
            border-bottom: 1px solid #555;
            padding: 10px 0;
            outline: none;
            width: 100%;
            text-align: center;
            letter-spacing: 0.2em;
            transition: border-color 0.2s;
        }

        .gate input[type="password"]:focus { border-bottom-color: #fff; }

        .gate button {
            margin-top: 24px;
            font-family: 'Lato', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #111;
            background: #fff;
            border: none;
            padding: 14px 36px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }

        .gate button:hover { opacity: 0.75; }

        .gate-error {
            margin-top: 14px;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #e07070;
        }

        /* ADMIN PANEL */
        .admin-panel {
            width: 100%;
            max-width: 480px;
            display: none;
        }

        /* OPEN / CLOSE TOGGLE */
        .bookings-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            border: 1px solid #2a2a2a;
            margin-bottom: 32px;
        }

        .status-label {
            font-size: 0.65rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            opacity: 0.45;
            margin-bottom: 4px;
        }

        .status-val {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .status-val.open   { color: #7ec87e; }
        .status-val.closed { color: #e07070; }

        .toggle-btn {
            font-family: 'Lato', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #111;
            background: #fff;
            border: none;
            padding: 10px 16px;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .toggle-btn:hover { opacity: 0.75; }
        .toggle-btn:disabled { opacity: 0.3; cursor: default; }

        /* SLOT GRID */
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        @media (min-width: 400px) {
            .slot-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .slot-btn {
            font-family: 'Lato', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 18px 8px;
            border: 1px solid #2a2a2a;
            background: none;
            color: #fff;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, opacity 0.15s;
            -webkit-tap-highlight-color: transparent;
            min-height: 72px;
        }

        .slot-btn:active { opacity: 0.6; }

        .slot-btn.taken {
            background: #fff;
            color: #111;
            border-color: #fff;
        }

        .slot-btn.busy {
            opacity: 0.4;
            pointer-events: none;
        }

        .slot-time {
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .slot-status {
            font-size: 0.55rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .slot-btn:not(.taken) .slot-status { opacity: 0.35; }

        /* STATUS */
        .status-msg {
            margin-top: 20px;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.45;
            text-align: center;
            min-height: 1.4em;
        }

        footer {
            margin-top: auto;
            padding-top: 48px;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.25;
        }
    </style>
</head>
<body>

    <h1>Slot Admin</h1>
    <p class="subtitle">Luali Backyard Pizza Night</p>

    <!-- PASSWORD GATE -->
    <div class="gate" id="gate">
        <label for="adminPw">Password</label>
        <input type="password" id="adminPw" autocomplete="current-password">
        <button onclick="unlock()">Enter</button>
        <p class="gate-error" id="gateError" hidden>Wrong password.</p>
    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-panel" id="adminPanel">
        <div class="bookings-status">
            <div>
                <div class="status-label">Bookings</div>
                <div class="status-val" id="closedVal">—</div>
            </div>
            <button class="toggle-btn" id="toggleBtn" onclick="toggleClosed()">—</button>
        </div>
        <div class="slot-grid" id="slotGrid"></div>
        <p class="status-msg" id="statusMsg"></p>
    </div>

    <footer>&copy; 2026 Luali Pizza</footer>

    <script>
    const ADMIN_PASSWORD = 'luali2026';

    const SLOTS = [
        '5:00pm', '5:10pm', '5:20pm', '5:30pm', '5:40pm', '5:50pm',
        '6:00pm', '6:10pm', '6:20pm', '6:30pm', '6:40pm', '6:50pm',
        '7:00pm', '7:10pm', '7:20pm', '7:30pm', '7:40pm', '7:50pm',
    ];

    document.getElementById('adminPw').addEventListener('keydown', e => {
        if (e.key === 'Enter') unlock();
    });

    function unlock() {
        const pw = document.getElementById('adminPw').value;
        if (pw !== ADMIN_PASSWORD) {
            document.getElementById('gateError').hidden = false;
            document.getElementById('adminPw').value = '';
            document.getElementById('adminPw').focus();
            return;
        }
        document.getElementById('gate').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadSlots();
    }

    let currentClosed = false;

    async function loadSlots() {
        document.getElementById('statusMsg').textContent = 'Loading...';
        let data = { slots: [], closed: false };
        try {
            const res = await fetch('/.netlify/functions/booked-slots');
            data = await res.json();
        } catch {
            document.getElementById('statusMsg').textContent = 'Could not load — check connection.';
            return;
        }

        currentClosed = !!data.closed;
        const closedVal = document.getElementById('closedVal');
        const toggleBtn = document.getElementById('toggleBtn');
        if (currentClosed) {
            closedVal.textContent = 'Closed';
            closedVal.className = 'status-val closed';
            toggleBtn.textContent = 'Open bookings';
        } else {
            closedVal.textContent = 'Open';
            closedVal.className = 'status-val open';
            toggleBtn.textContent = 'Close bookings';
        }

        const booked = new Set(data.slots || []);
        const grid = document.getElementById('slotGrid');
        grid.innerHTML = '';

        SLOTS.forEach(slot => {
            const taken = booked.has(slot);
            const btn = document.createElement('button');
            btn.className = 'slot-btn' + (taken ? ' taken' : '');
            btn.innerHTML =
                '<span class="slot-time">' + slot + '</span>' +
                '<span class="slot-status">' + (taken ? 'Blocked' : 'Free') + '</span>';
            btn.addEventListener('click', () => toggleSlot(btn, slot));
            grid.appendChild(btn);
        });

        const count = booked.size;
        document.getElementById('statusMsg').textContent =
            count === 0 ? 'No slots blocked.' : count + ' slot' + (count === 1 ? '' : 's') + ' blocked. Tap to toggle.';
    }

    async function toggleSlot(btn, slot) {
        const isTaken = btn.classList.contains('taken');
        btn.classList.add('busy');

        try {
            const res = await fetch('/.netlify/functions/booked-slots', {
                method: isTaken ? 'DELETE' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slot }),
            });

            if (res.ok) {
                await loadSlots();
            } else {
                document.getElementById('statusMsg').textContent = 'Failed — try again.';
                btn.classList.remove('busy');
            }
        } catch {
            document.getElementById('statusMsg').textContent = 'Failed — try again.';
            btn.classList.remove('busy');
        }
    }

    async function toggleClosed() {
        const btn = document.getElementById('toggleBtn');
        btn.disabled = true;

        try {
            const res = await fetch('/.netlify/functions/booked-slots', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ closed: !currentClosed }),
            });

            if (res.ok) {
                await loadSlots();
            } else {
                document.getElementById('statusMsg').textContent = 'Failed — try again.';
            }
        } catch {
            document.getElementById('statusMsg').textContent = 'Failed — try again.';
        }

        btn.disabled = false;
    }
    </script>

</body>
</html>
